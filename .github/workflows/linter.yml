name: Linters

on:
  merge_group:
  pull_request:
  push:
    branches:
      - version-16
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PRE_COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  linter:
    name: ci/lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
          check-latest: false

      - name: Install exact pre-commit runner
        run: python -m pip install --no-input pre-commit==4.6.1

      - name: Run repository hooks for the candidate delta
        run: |
          base="$PRE_COMMIT_BASE"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          pre-commit run --from-ref "$base" --to-ref "$GITHUB_SHA" --show-diff-on-failure
